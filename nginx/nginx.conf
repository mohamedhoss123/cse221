events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver with variables for runtime resolution
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Frontend - React app
        location / {
            set $frontend_host "cse221_frontend";
            proxy_pass http://$frontend_host:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API
        location /api {
            set $backend_host "cse221_backend";
            proxy_pass http://$backend_host:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # WebSocket support for Vite HMR
        location ~ ^/.__vite_hmr {
            set $frontend_host "cse221_frontend";
            proxy_pass http://$frontend_host:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
